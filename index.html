<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Wieler Tracker</title>
</head>

<body>
  <h1>Mijn Wieler Tracker</h1>
  <p>Hier houd ik mijn trainingen en resultaten bij.</p>

  <h2>Mijn trainingen</h2>
  <h3>Nieuwe training toevoegen</h3>

  <form>
    <label for="afstand">Afstand in kilometers:</label>
    <input type="number" id="afstand" name="afstand">

    <label for="tijd">Tijd in minuten:</label>
    <input type="number" id="tijd" name="tijd">

    <label for="snelheid">Gemiddelde snelheid in km/u:</label>
    <input type="number" id="snelheid" name="snelheid" step="0.1">

    <button type="submit">Training opslaan</button>
  </form>
</body>
</html>
